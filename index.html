<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbodA motors</title>
    <style>
        :root {
            --bg-color: #0F141A;
            --card-color: #161C23;
            --accent-color: #FF3B30;
            --text-color: #FFFFFF;
            --secondary-text: #8E9EAB;
            --border-color: #1E232A;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 {
            font-size: 22px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .card {
            background-color: var(--card-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        .card-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
            color: var(--text-color);
        }
        .card-info p {
            font-size: 13px;
            color: var(--secondary-text);
        }
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .btn-secondary {
            background-color: var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .btn-danger {
            background-color: #2A1616;
            color: #FF5252;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-color);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        .back-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .empty-state {
            text-align: center;
            color: var(--secondary-text);
            margin-top: 50px;
            font-size: 15px;
        }
        .calc-card {
            background: #11171f;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .loading-state {
            text-align: center;
            color: var(--secondary-text);
            margin-top: 50px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="loading-state">جاري تحميل البيانات...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // حط بياناتك هنا: Project URL و anon public key
        // من Supabase Dashboard > Settings > API
        // ============================================
        const SUPABASE_URL = "https://qicrekcfewsfvhbauyhc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_GtGCblg9OuZFtMThlrYHHQ_cQBscNwM";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ROW_ID = "showrooms";

        let data = [];
        let currentShowroomIndex = null;

        // تحميل البيانات من Supabase
        async function loadData() {
            try {
                const { data: row, error } = await supabaseClient
                    .from('app_state')
                    .select('value')
                    .eq('id', ROW_ID)
                    .single();

                if (error) {
                    console.error(error);
                    // لو الصف لسه غير موجود، ابدأ بمصفوفة فاضية
                    data = [];
                } else {
                    data = row.value || [];
                }
            } catch (e) {
                console.error(e);
                data = [];
                document.getElementById('app').innerHTML =
                    '<div class="empty-state">فشل الاتصال بقاعدة البيانات. تأكد من اتصال الإنترنت وبيانات Supabase.</div>';
                return;
            }
            if (!Array.isArray(data)) {
                data = [];
            }
            renderHome();
        }

        async function syncData() {
            try {
                const { error } = await supabaseClient
                    .from('app_state')
                    .upsert({ id: ROW_ID, value: data, updated_at: new Date().toISOString() });

                if (error) {
                    console.error(error);
                    alert("حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى");
                }
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى");
            }
        }

        function renderHome() {
            currentShowroomIndex = null;
            let html = `
                <header>
                    <h1><span>🏍️</span> AbodA motors</h1>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-secondary" onclick="openCalculatorModal()">🧮 الحاسبة</button>
                        <button class="btn" onclick="openShowroomModal()">+ معرض</button>
                    </div>
                </header>
                <div class="content">
            `;

            if (data.length === 0) {
                html += `<div class="empty-state">لا توجد معارض مضافة حالياً<br>اضغط على زر معرض جديد للبدء</div>`;
            } else {
                data.forEach((showroom, index) => {
                    let motosCount = (showroom && showroom.motorcycles) ? showroom.motorcycles.length : 0;
                    html += `
                        <div class="card">
                            <div class="card-info">
                                <h3>${showroom.name || 'معرض'}</h3>
                                <p>الموتوسيكلات المسجلة: ${motosCount}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-secondary" onclick="renderDetails(${index})">دخول</button>
                                <button class="btn-danger" onclick="deleteShowroom(${index})">حذف</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        function renderDetails(index) {
            let showroom = data[index];
            if (!showroom) {
                renderHome();
                return;
            }
            showroom.motorcycles = showroom.motorcycles || [];
            currentShowroomIndex = index;
            let motos = showroom.motorcycles;

            let html = `
                <div class="back-bar">
                    <button class="btn-secondary" onclick="renderHome()">❮ رجوع</button>
                    <h2 style="color: var(--accent-color); font-size: 18px;">${showroom.name}</h2>
                    <button class="btn-secondary" onclick="openCalculatorModal()">🧮 الحاسبة</button>
                </div>
                <header style="margin-bottom: 16px;">
                    <h1 style="font-size: 16px;">قائمة الموتوسيكلات</h1>
                    <button class="btn" onclick="openMotoModal()">+ إضافة موتوسيكل</button>
                </header>
                <div class="content">
            `;

            if (motos.length === 0) {
                html += `<div class="empty-state">لا توجد موتوسيكلات مسجلة في هذا المعرض</div>`;
            } else {
                motos.forEach((moto, motoIndex) => {
                    html += `
                        <div class="card">
                            <div class="card-info">
                                <h3>${moto.name}</h3>
                                <p>${moto.cc} CC | العدد: ${moto.quantity} | المالك: ${moto.owner}</p>
                            </div>
                            <div class="card-actions">
                                <button class="btn-danger" onclick="removeMoto(${motoIndex})">🗑️ حذف</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            document.getElementById('app').innerHTML = html;
        }

        function closeModal() {
            document.querySelectorAll(".modal").forEach(m => m.remove());
        }

        function openShowroomModal() {
            closeModal();
            let modalHtml = `
                <div class="modal" id="customModal">
                    <div class="modal-content">
                        <h2>إضافة معرض جديد</h2>
                        <input type="text" id="srName" class="form-control" placeholder="اسم المعرض (مثال: معرض السرعة)">
                        <div class="modal-buttons">
                            <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
                            <button class="btn" onclick="saveShowroom()">حفظ</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function saveShowroom() {
            let nameInput = document.getElementById('srName');
            if (!nameInput) return;
            let name = nameInput.value.trim();
            if (!name) return alert('برجاء إدخال اسم المعرض');

            if (data.some(s => s.name === name)) {
                return alert("المعرض موجود بالفعل");
            }

            data.push({ name: name, motorcycles: [] });
            closeModal();
            await syncData();
            renderHome();
        }

        function openMotoModal() {
            closeModal();
            let modalHtml = `
                <div class="modal" id="customModal">
                    <div class="modal-content">
                        <h2>إضافة موتوسيكل جديد</h2>
                        <input type="text" id="mName" class="form-control" placeholder="اسم الموتوسيكل">
                        <input type="number" id="mCc" class="form-control" placeholder="السعة (CC)">
                        <input type="number" id="mQty" class="form-control" placeholder="العدد">
                        <input type="text" id="mOwner" class="form-control" placeholder="صاحب المعرض / المالك">
                        <div class="modal-buttons">
                            <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
                            <button class="btn" onclick="saveMoto()">إضافة</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function saveMoto() {
            if (currentShowroomIndex === null || !data[currentShowroomIndex]) return;
            data[currentShowroomIndex].motorcycles = data[currentShowroomIndex].motorcycles || [];

            let name = document.getElementById('mName').value.trim();
            let ccVal = document.getElementById('mCc').value.trim();
            let qtyVal = document.getElementById('mQty').value.trim();
            let owner = document.getElementById('mOwner').value.trim();
            let cc = Number(ccVal);
            let qty = Number(qtyVal);

            if (!name || !owner || ccVal === '' || qtyVal === '' || isNaN(cc) || isNaN(qty)) {
                return alert('برجاء إكمال جميع الحقول بشكل صحيح');
            }

            if (cc <= 0 || qty <= 0) {
                return alert("القيم غير صحيحة");
            }

            data[currentShowroomIndex].motorcycles.push({ name, cc, quantity: qty, owner });
            closeModal();
            await syncData();
            renderDetails(currentShowroomIndex);
        }

        const DELETE_PASSWORD = "1112004";

        async function deleteShowroom(index) {
            if (!data[index]) return;
            let pass = prompt("أدخل كلمة السر لحذف المعرض:");
            if (pass === null) return;
            if (pass !== DELETE_PASSWORD) {
                return alert("كلمة السر غير صحيحة، لم يتم الحذف");
            }
            if (confirm("هل أنت متأكد من حذف هذا المعرض؟")) {
                data.splice(index, 1);
                await syncData();
                renderHome();
            }
        }

        async function removeMoto(motoIndex) {
            if (currentShowroomIndex === null || !data[currentShowroomIndex]) return;
            let motos = data[currentShowroomIndex].motorcycles;
            if (!motos || !motos[motoIndex]) return;

            if (confirm('هل أنت متأكد من حذف هذا الموتوسيكل؟')) {
                motos.splice(motoIndex, 1);
                await syncData();
                renderDetails(currentShowroomIndex);
            }
        }

        function openCalculatorModal() {
            closeModal();
            let modalHtml = `
                <div class="modal" id="customModal">
                    <div class="modal-content">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h2 style="color:var(--accent-color); margin:0;">حاسبة الأقساط المتقدمة</h2>
                            <button class="btn-secondary" onclick="closeModal()">إغلاق ✕</button>
                        </div>
                        <div>
                            <label style="font-size:13px; color:var(--secondary-text);">المبلغ الإجمالي</label>
                            <input type="number" id="calcTotal" class="form-control" placeholder="أدخل المبلغ الكامل..." oninput="calculateInstallments()">
                        </div>
                        <div>
                            <label style="font-size:13px; color:var(--secondary-text);">الدفعة المقدمة</label>
                            <input type="number" id="calcDown" class="form-control" placeholder="أدخل مبلغ المقدم..." oninput="calculateInstallments()">
                        </div>
                        <div>
                            <label style="font-size:13px; color:var(--secondary-text); display:block; margin-bottom:5px;">اختر مدة التقسيط</label>
                            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
                                <button type="button" class="btn-secondary plan-btn" onclick="setPlan(12, this)" style="border: 2px solid var(--accent-color);">سنة (35%)</button>
                                <button type="button" class="btn-secondary plan-btn" onclick="setPlan(18, this)">سنة ونصف (55%)</button>
                                <button type="button" class="btn-secondary plan-btn" onclick="setPlan(24, this)">سنتين (70%)</button>
                            </div>
                        </div>
                        <div class="calc-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                                <span>المتبقي بعد المقدم:</span>
                                <span id="resRemaining" style="font-weight:bold;">0 ج.م</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                                <span>قيمة الفائدة:</span>
                                <span id="resInterest" style="font-weight:bold; color:#FF5252;">0 ج.م</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; border-top:1px solid var(--border-color); padding-top:8px; font-weight:bold; font-size:15px;">
                                <span>إجمالي المطلوب:</span>
                                <span id="resFinal">0 ج.م</span>
                            </div>
                            <div style="margin-top:12px; background:var(--accent-color); padding:12px; border-radius:8px; text-align:center;">
                                <div style="font-size:12px; opacity:0.9;">القسط الشهري</div>
                                <div id="resMonthly" style="font-size:20px; font-weight:bold;">0 ج.م</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            window.currentPlanMonths = 12;
            window.currentPlanRate = 0.35;
        }

        function setPlan(months, element) {
            document.querySelectorAll('.plan-btn').forEach(btn => btn.style.border = '1px solid var(--border-color)');
            element.style.border = '2px solid var(--accent-color)';
            if(months === 12) { window.currentPlanMonths = 12; window.currentPlanRate = 0.35; }
            if(months === 18) { window.currentPlanMonths = 18; window.currentPlanRate = 0.55; }
            if(months === 24) { window.currentPlanMonths = 24; window.currentPlanRate = 0.70; }
            calculateInstallments();
        }

        function calculateInstallments() {
            let total = parseFloat(document.getElementById('calcTotal').value) || 0;
            let down = parseFloat(document.getElementById('calcDown').value) || 0;
            let validDown = Math.min(down, total);
            let remaining = Math.max(0, total - validDown);
            let rate = window.currentPlanRate || 0.35;
            let months = window.currentPlanMonths || 12;

            let interest = remaining * rate;
            let final = remaining + interest;
            let monthly = final / months;

            document.getElementById('resRemaining').innerText = remaining.toLocaleString() + ' ج.م';
            document.getElementById('resInterest').innerText = '+' + interest.toLocaleString() + ' ج.م';
            document.getElementById('resFinal').innerText = final.toLocaleString() + ' ج.م';
            document.getElementById('resMonthly').innerText = monthly.toLocaleString() + ' ج.م';
        }

        // تشغيل التطبيق
        loadData();
    </script>
</body>
</html>
