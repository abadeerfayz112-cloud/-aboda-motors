<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AbodA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--card:#141417;--tx:#eceef1;--mut:#8b8f98;--pri:#e11d2e;--bd:#26262b;--neg:#ff6b6b;--pos:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#000;color:#fff;border-bottom:2px solid var(--pri);position:sticky;top:0;z-index:5}
header img{height:34px;display:block}
.badge{background:var(--pri);border-radius:99px;padding:2px 10px;font-size:13px;text-transform:uppercase}
main{padding:14px 14px 100px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--mut);cursor:pointer}
nav a i{display:block;font-style:normal;font-size:20px}
nav a.on{color:var(--pri);font-weight:700}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
.btn{width:100%;padding:13px;margin:10px 0;border:0;border-radius:10px;background:linear-gradient(135deg,#e11d2e,#a30f1c);box-shadow:0 0 14px #e11d2e44;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:#3a1114;border:1px solid var(--pri);box-shadow:none}
button{font:inherit}
.card,.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.end{text-align:left;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid small{display:block;color:var(--mut)}
.grid b{font-size:18px}
.card h4{margin:0 0 8px}
.mut,small{color:var(--mut)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{background:#1d1d22;border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;margin-top:6px}
.row button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.auth{max-width:380px;margin:5vh auto;padding:20px;text-align:center}
.auth h1{margin-bottom:0}
.auth .emb{width:78%;max-width:300px;display:block;margin:0 auto}
.auth .nm{width:70%;max-width:260px;display:block;margin:-6px auto 10px}
.auth a,a{color:var(--pri);cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
#toast{position:fixed;top:70px;inset-inline:16px;background:#1d1d22;border:1px solid var(--pri);color:#fff;padding:12px;border-radius:10px;z-index:30;display:none;text-align:center}

#ad{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}
#ad video{max-width:100%;max-height:82vh}
#ad .bar{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px}
#ad .tag{background:#ffffff22;border-radius:6px;padding:2px 8px;font-size:12px}
#ad button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:99px;padding:8px 16px}
.chipbar{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.chipbar a{white-space:nowrap;padding:7px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx)}
.chipbar a.on{background:var(--pri);border-color:var(--pri);color:#fff}
.nav2{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.nav2 button{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0}
.bars div{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px}
hr{border:0;border-top:1px solid var(--bd);margin:8px 0}
@media(min-width:900px){
 nav{inset-block:58px 0;inset-inline:auto;inset-inline-start:0;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--bd);padding:10px 0}
 nav a{display:flex;flex:none;align-items:center;gap:12px;font-size:15px;padding:14px 20px;text-align:start}
 nav a i{display:inline;font-size:20px}
 main{margin-inline-start:200px;max-width:none;padding:20px 28px 40px}
 #pl{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
 .sheet{max-width:560px;border-radius:18px;margin:auto}
 #modal{align-items:center}
}
nav a{position:relative}
.dot{position:absolute;top:3px;inset-inline-end:calc(50% - 26px);background:var(--pri);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#1d1d22;flex:none;display:flex;align-items:center;justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:8px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px;cursor:pointer;text-align:center}
.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#1d1d22;display:flex;align-items:center;justify-content:center;font-size:30px}
.tile b{display:block;font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{z-index:60}
#scan{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
#scan .top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;color:#fff}
#scan button#scx{border:1px solid #444;background:#1d1d22;color:#fff;border-radius:99px;padding:8px 16px;font:inherit}
#scr{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scr video{width:100%!important;height:auto!important;max-height:70vh;object-fit:cover}
#scan .scf{padding:12px 14px calc(14px + env(safe-area-inset-bottom));text-align:center}
.trow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>
<div id="app"></div><div id="modal" onclick="closeM(event)"></div><div id="toast"></div>
<script>
const U='https://qicrekcfewsfvhbauyhc.supabase.co',K='sb_publishable_GtGCblg9OuZFtMThlrYHHQ_cQBscNwM';
const sb=supabase.createClient(U,K);
const TYPES={clothing:'ملابس وأحذية',electronics:'إلكترونيات وموبايلات',motorcycles:'موتوسيكلات وقطع غيار',supermarket:'سوبر ماركت وأدوات منزلية',wholesale:'معارض ومخازن وجملة',other:'نشاط آخر'};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
let S={biz:null,role:null,user:null,fields:[],products:[],cart:[],tab:'home'},mode='in';
const plan=()=>S.biz.plan_id!=='free'&&S.biz.plan_expires_at&&new Date(S.biz.plan_expires_at)>new Date()?S.biz.plan_id:'free';
const isPro=()=>plan()!=='free',isBiz=()=>plan()==='business';
const thumb=p=>p&&p.image_url?`<img class=thumb loading=lazy src="${esc(p.image_url)}" alt="">`:'<div class=thumb>📦</div>';
const lowCount=()=>(S.products||[]).filter(p=>p.quantity<=p.min_quantity).length;
function updDot(){const n=lowCount();if(n&&!S.warned&&S.biz){S.warned=1;toast('⚠️ '+n+' منتج خلص أو قرّب يخلص')}
 const a=document.querySelector('nav a[data-t=prods]');if(!a)return;let d=a.querySelector('.dot');if(!n){if(d)d.remove();return}if(!d){d=document.createElement('b');d.className='dot';a.appendChild(d)}d.textContent=n}
function lowModal(){const L=S.products.filter(p=>p.quantity<=p.min_quantity);modal(`<h3>⚠️ منتجات خلصت أو قربت تخلص</h3>${L.map(p=>`<div class=trow><span class=row style="margin:0;gap:10px">${thumb(p)}${esc(p.name)}</span><b class=neg>${p.quantity<=0?'خلص':fmt(p.quantity)} <small>(الحد ${fmt(p.min_quantity)})</small></b></div>`).join('')}<button class="btn sec" onclick="closeM()">إغلاق</button>`)}
const lowBanner=()=>{const n=lowCount();return n?`<div class=card onclick="lowModal()" style="cursor:pointer;border-color:var(--pri)"><b>⚠️ ${n} منتج خلص أو قرّب يخلص</b><br><small>اضغط عشان تشوفهم${isPro()?' أو افتح "قائمة اشتري إيه" من المزيد':''}</small></div>`:''};
function imgShrink(f,m,q){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b||f),'image/jpeg',q)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)})}
const canEdit=()=>['owner','manager'].includes(S.role);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
function modal(h){const m=$('#modal');m.innerHTML=`<div class=sheet>${h}</div>`;m.classList.add('on')}
function closeM(e){if(e&&e.target.id!=='modal')return;$('#modal').classList.remove('on');$('#modal').innerHTML=''}

/* ---------- الدخول ---------- */
function authView(){app.innerHTML=`<div class=auth><img class=emb src=logo-emblem.webp alt=""><img class=nm src=logo-name.webp alt=AbodA><p class=mut>إدارة محلك بسهولة</p>
<input id=em type=email placeholder="الإيميل" dir=ltr><input id=pw type=password placeholder="كلمة السر (6 حروف على الأقل)" dir=ltr>
<button class=btn onclick=doAuth()>${mode==='in'?'دخول':'إنشاء حساب'}</button>${mode==='up'?'<small class=mut>بالتسجيل أنت موافق على <a href="terms.html" target=_blank>شروط الاستخدام</a> و<a href="privacy.html" target=_blank>سياسة الخصوصية</a></small><br><br>':''}
${mode==='in'?'<a onclick=forgot()>نسيت كلمة السر؟</a><br><br>':''}<a onclick="mode=mode==='in'?'up':'in';authView()">${mode==='in'?'مفيش حساب؟ سجل دلوقتي':'عندي حساب بالفعل'}</a></div>`}
async function forgot(){const email=$('#em').value.trim();if(!email)return toast('اكتب الإيميل الأول');
 const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});toast(r.error?r.error.message:'اتبعتلك رابط لتغيير كلمة السر على الإيميل')}
function newPass(){modal(`<h3>كلمة سر جديدة</h3><input id=np type=password dir=ltr placeholder="كلمة السر الجديدة (6 حروف على الأقل)"><button class=btn onclick=savePass()>حفظ</button>`)}
async function savePass(){const r=await sb.auth.updateUser({password:$('#np').value});if(r.error)return toast(r.error.message);closeM();toast('تم تغيير كلمة السر ✅')}
async function doAuth(){const email=$('#em').value.trim(),password=$('#pw').value;
 const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('اتبعتلك رسالة تأكيد على الإيميل، أكدها وبعدين ادخل');
 loadBiz()}
function setupView(){app.innerHTML=`<div class=auth><img class=nm src=logo-name.webp alt=AbodA style="margin-top:0"><h2>أهلاً بيك 👋</h2><p class=mut>عرّفنا على محلك</p>
<input id=bn placeholder="اسم المحل أو المعرض"><select id=bt>${Object.entries(TYPES).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select>
<button class=btn onclick=mkBiz()>ابدأ</button><a onclick="sb.auth.signOut()">خروج</a></div>`}
async function mkBiz(){const r=await sb.rpc('create_business',{p_name:$('#bn').value,p_type:$('#bt').value});if(r.error)return toast(r.error.message);loadBiz()}

/* ---------- تحميل البيانات ---------- */
async function loadBiz(){
 const {data:{user}}=await sb.auth.getUser();S.user=user;
 const {data,error}=await sb.from('members').select('role,businesses(*)').eq('user_id',user.id).limit(1);
 if(error)return toast(error.message);
 if(!data.length)return setupView();
 S.role=data[0].role;S.biz=data[0].businesses;
 const ad=await sb.from('app_admins').select('user_id').eq('user_id',user.id);S.admin=!!(ad.data&&ad.data.length);
 await loadData();render();loadAds().then(()=>setTimeout(maybeAd,4000))}
async function loadData(){
 const [f,p]=await Promise.all([sb.from('field_definitions').select('*').eq('business_id',S.biz.id).order('sort_order'),sb.from('products').select('*').eq('business_id',S.biz.id).order('name')]);
 S.fields=f.data||[];S.products=p.data||[];updDot()}
function render(){
 app.innerHTML=`<header><img src=logo-name.webp alt=AbodA><span><small style="color:#c9ccd3;margin-inline-end:8px">${esc(S.biz.name)}</small><span class=badge onclick="page('upgrade')" style="cursor:pointer">${plan()}</span></span></header><main id=main></main>
<nav>${[['home','🏠','الرئيسية'],['prods','📦','المنتجات'],['sell','🛒','بيع']].concat(canEdit()?[['reports','📊','التقارير']]:[]).concat([['more','⚙️','المزيد']]).map(t=>`<a data-t="${t[0]}" class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}${t[0]==='prods'&&lowCount()?`<b class=dot>${lowCount()}</b>`:''}</a>`).join('')}</nav>`;
 views[S.tab]()}
function go(t){S.tab=t;render();if(t==='home'||t==='reports')setTimeout(maybeAd,1500)}

/* ---------- الرئيسية ---------- */
const rng=(a,b)=>sb.rpc('report_summary',{p_business:S.biz.id,p_from:a.toISOString(),p_to:b.toISOString()}).then(r=>(r.data&&r.data[0])||{});
async function home(){
 $('#main').innerHTML='<p class=mut>جاري التحميل...</p>';
 const bz=await sb.from('businesses').select('*').eq('id',S.biz.id).single();if(bz.data){S.biz=bz.data;const bd=document.querySelector('.badge');if(bd)bd.textContent=plan()}
 const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);
 const c=new Date(a.getFullYear(),a.getMonth(),1),d=new Date(a.getFullYear(),a.getMonth()+1,1);
 const ed=canEdit(),pro=plan()!=='free';
 const [t,mo]=await Promise.all([rng(a,b),pro&&ed?rng(c,d):null]);S.last=t;
 const num=(l,v,x)=>`<div ${x||''}><small>${l}</small><b ${x&&v<0?'class=neg':''}>${fmt(v)}</b></div>`;
 const today=`<div class=card><h4>اليوم</h4><div class=grid>${num('المبيعات',t.revenue)}${ed?num('المصروفات',t.expenses):''}${ed?`<div onclick="profitWhy(S.last)" style="cursor:pointer"><small>صافي الربح ⓘ</small><b class="${t.net_profit<0?'neg':'pos'}">${fmt(t.net_profit)}</b></div>`:''}<div><small>عدد العمليات</small><b>${t.sales_count||0}</b></div></div>
${ed?`<button class="btn sec" onclick=dayDetail()>📋 تفاصيل أرباح اليوم</button>`:''}</div>`;
 const month=!ed?'':pro?`<div class=card><h4>الشهر ده</h4><div class=grid>${num('المبيعات',mo.revenue)}${num('المصروفات',mo.expenses)}<div onclick="profitWhy(S.mo)" style="cursor:pointer"><small>صافي الربح ⓘ</small><b class="${mo.net_profit<0?'neg':'pos'}">${fmt(mo.net_profit)}</b></div>${num('عدد العمليات',mo.sales_count||0)}</div><button class="btn sec" onclick="go('reports')">📊 كل التقارير (أسبوع / سنة / أي يوم فات)</button></div>`:`<div class=card onclick="page('upgrade')" style="cursor:pointer"><h4>📊 التقارير الكاملة 🔒</h4><small>الأسبوع والشهر والسنة وأي يوم فات. متاحة في Pro وBusiness، وبدون إعلانات. <b style="color:var(--pri)">اضغط للترقية</b></small></div>`;
 S.mo=mo;
 $('#main').innerHTML=banner()+lowBanner()+today+month+invCard()}
function invCard(){const P=S.products,q=p=>Math.max(0,+p.quantity),u=P.reduce((s,p)=>s+q(p),0),vc=P.reduce((s,p)=>s+q(p)*p.cost_price,0),vs=P.reduce((s,p)=>s+q(p)*p.sale_price,0);
 const out=P.filter(p=>p.quantity<=0),low=P.filter(p=>p.quantity>0&&p.quantity<=p.min_quantity);
 return `<div class=card><h4>📦 ملخص المخزون</h4><div class=grid><div><small>عدد الأصناف</small><b>${P.length}</b></div><div><small>إجمالي القطع</small><b>${fmt(u)}</b></div>${canEdit()?`<div><small>قيمته بسعر الشراء</small><b>${fmt(vc)}</b></div><div><small>قيمته بسعر البيع</small><b>${fmt(vs)}</b></div>`:''}</div>
${out.length?`<h4 style="margin-top:12px">🚫 نفدت (${out.length})</h4>${out.slice(0,10).map(p=>`<div class=row style="justify-content:space-between"><span>${esc(p.name)}</span><b class=neg>0</b></div>`).join('')}`:''}
${low.length?`<h4 style="margin-top:12px">⚠️ كميتها قليلة (${low.length})</h4>${low.slice(0,10).map(p=>`<div class=row style="justify-content:space-between"><span>${esc(p.name)}</span><span><b class=neg>${fmt(p.quantity)}</b> <small>من حد ${fmt(p.min_quantity)}</small></span></div>`).join('')}`:''}
${!out.length&&!low.length&&P.length?'<p class=mut>✅ مفيش منتجات ناقصة</p>':''}${!P.length?'<p class=mut>ضيف منتجاتك من تاب المنتجات</p>':''}</div>`}
function profitWhy(t){t=t||{};const r=(l,v,c)=>`<div class=row style="justify-content:space-between"><span>${l}</span><b ${c?`class="${c}"`:''}>${fmt(v)}</b></div>`;
 modal(`<h3>إزاي بنحسب صافي الربح؟</h3><div class=card>${r('المبيعات',t.revenue)}${r('− تكلفة البضاعة اللي اتباعت',t.cost)}<hr>${r('= ربح المبيعات',t.gross_profit)}${r('− المصروفات',t.expenses)}<hr>${r('= صافي الربح',t.net_profit,t.net_profit<0?'neg':'pos')}</div><small>تكلفة البضاعة = سعر شراء كل قطعة وقت بيعها. المشتريات نفسها مش بتتخصم هنا، لأنها بضاعة في المخزون لحد ما تتباع.</small>`)}
async function dayDetail(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);
 const [it,ex,sl]=await Promise.all([sb.rpc('report_items',{p_business:S.biz.id,p_from:a.toISOString(),p_to:b.toISOString()}),sb.from('expenses').select('*').eq('business_id',S.biz.id).gte('created_at',a.toISOString()).lt('created_at',b.toISOString()),sb.from('sales').select('total,paid_amount,payment_method').eq('business_id',S.biz.id).gte('created_at',a.toISOString()).lt('created_at',b.toISOString())]);
 const rows=it.data||[],e2=ex.data||[],tm=x=>new Date(x).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});

 if(!q){$('#sl').innerHTML=av.length?`<div class=pgrid>${av.slice(0,36).map(p=>`<div class=tile onclick="addC('${p.id}')">${p.image_url?`<img loading=lazy src="${esc(p.image_url)}" alt="">`:'<div class=ph>📦</div>'}<b>${esc(p.name)}</b><small>${fmt(p.sale_price)}</small></div>`).join('')}</div>${av.length>36?'<small class=mut>اكتب في البحث لباقي المنتجات</small>':''}`:'';return}

 if(c){if(c.qty<p.quantity){c.qty++;applyPromo(c,p)}}else{const it={id,name:p.name,qty:1,price:p.sale_price,max:p.quantity,img:p.image_url||null};applyPromo(it,p);S.cart.push(it)}

async function doSale(){const items=S.cart.map(c=>({product_id:c.id,quantity:c.qty,unit_price:c.price})),tot=S.cart.reduce((x,c)=>x+c.qty*c.price,0);
 const cid=(isPro()&&$('#cid')&&$('#cid').value)||null,paid=isPro()&&S.paid!==undefined&&S.paid!==''&&S.paid!==null?+S.paid:null;
 if(paid!==null&&paid<tot&&!cid)return toast('اختار العميل عشان الباقي يتسجل آجل');
 const r=await sb.rpc('make_sale',{p_business:S.biz.id,p_customer:$('#cu').value,p_items:items,p_customer_id:cid,p_paid:paid,p_method:isPro()?(S.pm||'cash'):'cash'});

/* ---------- التقارير ---------- */
let R={unit:'day',ref:new Date(),f:'',t:''};
const UN={day:'يوم',week:'أسبوع',month:'شهر',year:'سنة',range:'فترة'};
function span(){const a=new Date(R.ref);a.setHours(0,0,0,0);const y=a.getFullYear(),m=a.getMonth(),L=(d,o)=>d.toLocaleDateString('ar-EG',o);let f,t,l;
 if(R.unit==='day'){f=a;t=new Date(a);t.setDate(t.getDate()+1);l=L(a,{weekday:'long',day:'numeric',month:'long'})}
 else if(R.unit==='week'){f=new Date(a);f.setDate(f.getDate()-((f.getDay()+1)%7));t=new Date(f);t.setDate(t.getDate()+7);const e=new Date(t);e.setDate(e.getDate()-1);l=L(f,{day:'numeric',month:'short'})+' ← '+L(e,{day:'numeric',month:'short'})}
 else if(R.unit==='month'){f=new Date(y,m,1);t=new Date(y,m+1,1);l=L(f,{month:'long',year:'numeric'})}
 else if(R.unit==='year'){f=new Date(y,0,1);t=new Date(y+1,0,1);l=String(y)}
 else{f=R.f?new Date(R.f+'T00:00'):a;t=new Date(((R.t||R.f)||'')?(R.t||R.f)+'T00:00':a);t.setDate(t.getDate()+1);l='فترة مخصصة'}
 return {f,t,l}}
function setUnit(u){if(plan()==='free'&&u!=='day'){toast('الأسبوع والشهر والسنة في باقة Pro وBusiness');return page('upgrade')}R.unit=u;reports()}
function shift(d){const r=new Date(R.ref);
 if(R.unit==='day')r.setDate(r.getDate()+d);else if(R.unit==='week')r.setDate(r.getDate()+7*d);else if(R.unit==='month')r.setMonth(r.getMonth()+d);else if(R.unit==='year')r.setFullYear(r.getFullYear()+d);
 const old=R.ref;R.ref=r;const sp=span();
 if(sp.f>new Date()){R.ref=old;return}
 if(plan()==='free'){const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-7);if(sp.f<lim){R.ref=old;toast('الباقة المجانية بتعرض آخر 7 أيام. رقّي لتشوف كل التاريخ');return page('upgrade')}}
 reports()}
function openDay(iso){R.unit='day';R.ref=new Date(iso+'T12:00');reports()}

 const free=plan()==='free',{f,t,l}=span();
 $('#main').innerHTML=`<div class=chipbar>${Object.keys(UN).map(u=>`<a class="${R.unit===u?'on':''}" onclick="setUnit('${u}')">${UN[u]}${free&&u!=='day'?' 🔒':''}</a>`).join('')}</div>
${R.unit==='range'?`<div class=grid><div><label>من</label><input type=date value="${R.f}" onchange="R.f=this.value;reports()"></div><div><label>إلى</label><input type=date value="${R.t}" onchange="R.t=this.value;reports()"></div></div>`:`<div class=nav2><button onclick="shift(-1)">›</button><b>${l}</b><button onclick="shift(1)">‹</button></div>`}
<div id=rs><p class=mut>جاري التحميل...</p></div>`;
 const args={p_business:S.biz.id,p_from:f.toISOString(),p_to:t.toISOString()};
 const [s2,d,top]=await Promise.all([sb.rpc('report_summary',args),sb.rpc('report_by_day',{...args,p_unit:R.unit==='year'?'month':'day'}),plan()==='business'?sb.rpc('report_top_products',args):null]);
 const r=(s2.data&&s2.data[0])||{},rows=d.data||[];S.last=r;
 const mx=Math.max(1,...rows.map(x=>+x.revenue)),pf=x=>x.revenue-x.cost-x.expenses;
 const lab=x=>new Date(x.period+'T12:00').toLocaleDateString('ar-EG',R.unit==='year'?{month:'long'}:{weekday:'short',day:'numeric',month:'short'});
 const n=(k,v,c)=>`<div><small>${k}</small><b ${c?`class="${c}"`:''}>${fmt(v)}</b></div>`;
 S.rows=rows;$('#rs').innerHTML=(isPro()?'<button class="btn sec" onclick=expReport()>📤 تصدير التقرير (Excel)</button>':'')+`<div class=card><div class=grid>${n('المبيعات',r.revenue)}${n('تكلفة البضاعة',r.cost)}${n('ربح المبيعات',r.gross_profit)}${n('المصروفات',r.expenses)}<div onclick="profitWhy(S.last)" style="cursor:pointer"><small>صافي الربح ⓘ</small><b class="${r.net_profit<0?'neg':'pos'}">${fmt(r.net_profit)}</b></div>${n('عدد العمليات',r.sales_count||0)}</div></div>
${rows.length>1?`<div class=card><h4>${R.unit==='year'?'حسب الشهر':'حسب اليوم'}</h4><div class=bars>${rows.map(x=>`<div style="height:${Math.max(2,x.revenue/mx*100)}%"></div>`).join('')}</div>${rows.map(x=>`<div class=item ${R.unit==='year'?'style="cursor:default"':`onclick="openDay('${x.period}')"`}><span>${lab(x)}</span><span class=end><b>${fmt(x.revenue)}</b><small class="${pf(x)<0?'neg':'pos'}">ربح ${fmt(pf(x))}</small></span></div>`).join('')}</div>`:''}
${!rows.length?'<p class=mut>مفيش حركة في الفترة دي</p>':''}
${plan()==='business'?(top&&top.data&&top.data.length?`<div class=card><h4>🏆 أكتر المنتجات ربحاً</h4>${top.data.map(x=>`<div class=row style="justify-content:space-between"><span>${esc(x.name)} <small>× ${fmt(x.qty)}</small></span><b class=pos>${fmt(x.profit)}</b></div>`).join('')}</div>`:''):`<div class=card onclick="page('upgrade')" style="cursor:pointer"><h4>🏆 أكتر المنتجات ربحاً 🔒</h4><small>في باقة Business. <b style="color:var(--pri)">اضغط للترقية</b></small></div>`}`}

/* ---------- أدوات: تصدير وتحميل ---------- */
function dl(name,mime,txt){const b=new Blob([txt],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}
function csv(name,head,rows){const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};dl(name+'.csv','text/csv;charset=utf-8','\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n'))}
async function fetchAll(t,sel){let out=[],f=0;for(;;){const r=await sb.from(t).select(sel).eq('business_id',S.biz.id).range(f,f+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break;f+=1000}return out}
const lockView=(t,need)=>{$('#main').innerHTML=`${back}<h3>${t}</h3><div class=card onclick="page('upgrade')" style="cursor:pointer"><h4>🔒 متاح في باقة ${need||'Pro وBusiness'}</h4><small>اضغط عشان تشوف الباقات.</small></div>`};
function expProds(){csv('products',['الاسم','الباركود','سعر الشراء','سعر البيع','الكمية','حد التنبيه'].concat(S.fields.map(f=>f.name)),S.products.map(p=>[p.name,p.barcode||'',p.cost_price,p.sale_price,p.quantity,p.min_quantity].concat(S.fields.map(f=>(p.attributes||{})[f.name]))))}
function expCust(){csv('customers',['العميل','التليفون','اتباعله آجل','دفع','المتبقي عليه'],S.cb.map(c=>[c.name,c.phone||'',c.owed,c.paid,c.balance]))}
function expShop(){csv('shopping-list',['المنتج','الموجود','المطلوب','التكلفة التقريبية'],S.shopL.map(x=>[x.p.name,x.p.quantity,x.n,x.n*x.p.cost_price]))}
function expReport(){const r=S.last||{},rows=S.rows||[];csv('report',['الفترة','المبيعات','تكلفة البضاعة','المصروفات','صافي الربح'],[['الإجمالي',r.revenue,r.cost,r.expenses,r.net_profit]].concat(rows.map(x=>[x.period,x.revenue,x.cost,x.expenses,x.revenue-x.cost-x.expenses])))}

function custForm(cb){modal(`<h3>عميل جديد</h3><label>الاسم</label><input id=cn><label>التليفون (اختياري)</label><input id=cp type=tel dir=ltr><button class=btn onclick="saveCust()">حفظ</button>`);window._ccb=cb}
async function saveCust(){const name=$('#cn').value.trim();if(!name)return toast('اكتب اسم العميل');

 if(r.error)return toast(r.error.message);closeM();const cb=window._ccb;window._ccb=null;if(cb)cb(r.data.id);else customers()}
async function custView(id){const c=S.cb.find(x=>x.id===id);if(!c)return;
 const [s1,p1]=await Promise.all([sb.from('sales').select('created_at,total,paid_amount').eq('customer_id',id).order('created_at',{ascending:false}).limit(50),sb.from('customer_payments').select('*').eq('customer_id',id).order('created_at',{ascending:false}).limit(50)]);
 const dt=x=>new Date(x).toLocaleDateString('ar-EG');
 const mv=(s1.data||[]).map(x=>({t:x.created_at,k:'s',tot:+x.total,paid:x.paid_amount==null?+x.total:+x.paid_amount})).concat((p1.data||[]).map(x=>({t:x.created_at,k:'p',amt:+x.amount,note:x.note}))).sort((a,b)=>new Date(b.t)-new Date(a.t));
 modal(`<h3>${esc(c.name)}</h3>${c.phone?`<a href="tel:${esc(c.phone)}" dir=ltr>${esc(c.phone)}</a>`:''}<div class=card><small>المطلوب منه</small><br><b style="font-size:26px" class="${c.balance>0?'neg':'pos'}">${fmt(c.balance)}</b></div>
<button class=btn onclick="recvForm('${id}')">💵 استلمت دفعة</button>
${mv.map(m=>m.k==='s'?`<div class=trow><span>🛍️ بيع ${fmt(m.tot)}${m.paid<m.tot?` <small>(دفع ${fmt(m.paid)})</small>`:''}<br><small>${dt(m.t)}</small></span><b class=neg>${m.tot-m.paid>0?'+'+fmt(m.tot-m.paid):'—'}</b></div>`:`<div class=trow><span>💵 دفعة${m.note?' • '+esc(m.note):''}<br><small>${dt(m.t)}</small></span><b class=pos>−${fmt(m.amt)}</b></div>`).join('')||'<p class=mut>مفيش حركة</p>'}

const rm2Chips=()=>Object.keys(PM).map(k=>`<a class="${S.rm2===k?'on':''}" onclick="S.rm2='${k}';$('#rmch2').innerHTML=rm2Chips()">${PM[k]}</a>`).join('');
function recvForm(id){S.rm2='cash';modal(`<h3>استلام دفعة</h3><label>المبلغ</label><input id=ra type=number><label>طريقة الدفع</label><div class=chipbar id=rmch2>${rm2Chips()}</div><label>ملاحظة (اختياري)</label><input id=rn><button class=btn onclick="saveRecv('${id}')">تسجيل</button>`)}
async function saveRecv(id){const amount=+$('#ra').value;if(!(amount>0))return toast('اكتب المبلغ');
 const r=await sb.from('customer_payments').insert({business_id:S.biz.id,customer_id:id,amount,payment_method:S.rm2||'cash',note:$('#rn').value.trim()||null});
 if(r.error)return toast(r.error.message);closeM();toast('تم تسجيل الدفعة ✅');customers()}
async function delCust(id){if(!confirm('حذف العميل؟ الدين المسجل عليه هيتشال من الحساب.'))return;const r=await sb.from('customers').delete().eq('id',id);if(r.error)return toast(r.error.message);closeM();customers()}

/* ---------- مسح الباركود بالكاميرا ---------- */
let SC=null;
function scanLib(){return new Promise((ok,no)=>{if(window.Html5Qrcode)return ok();const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';t.onload=ok;t.onerror=()=>no(new Error('تعذر تحميل أداة المسح، اتأكد من النت'));document.head.appendChild(t)})}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},110)}catch(e){}if(navigator.vibrate)navigator.vibrate(40)}
async function scanOpen(cb,o){o=o||{};await scanClose();
 const el=document.createElement('div');el.id='scan';
 el.innerHTML=`<div class=top><b>${o.title||'امسح الباركود'}</b><button id=scx>إغلاق ✕</button></div><div id=scr></div><div class=scf><small id=scm class=mut>وجّه الكاميرا ناحية الباركود</small><div class=row style="margin-top:8px"><input id=scman placeholder="أو اكتب الباركود يدوي" dir=ltr style="margin:0"><button id=scok class=btn style="width:auto;margin:0;padding:12px 18px">تمام</button></div></div>`;
 document.body.appendChild(el);let last='',lt=0;
 const done=code=>{const t=Date.now();if(code===last&&t-lt<1500)return;last=code;lt=t;beep();const r=cb(code);if(o.once||r==='close')scanClose()};
 $('#scx').onclick=scanClose;$('#scok').onclick=()=>{const v=$('#scman').value.trim();if(v){$('#scman').value='';done(v)}};
 try{await scanLib();const F=Html5QrcodeSupportedFormats;
  SC=new Html5Qrcode('scr',{formatsToSupport:[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.UPC_A,F.UPC_E,F.ITF,F.QR_CODE],useBarCodeDetectorIfSupported:true,verbose:false});
  await SC.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},c=>done(c),()=>{})}
 catch(e){$('#scm').textContent='الكاميرا مش شغالة ('+(e&&e.message?e.message:e)+') — اكتب الباركود يدوي'}}
async function scanClose(){const e=$('#scan');const s=SC;SC=null;if(s){try{await s.stop()}catch(x){}try{s.clear()}catch(x){}}if(e)e.remove()}
function scanSell(){scanOpen(code=>{const p=S.products.find(x=>x.barcode&&x.barcode===code);
  if(!p){toast('الباركود ده مش مسجل: '+code);return}
  if(p.quantity<=0){toast('خلص من المخزون: '+p.name);return}
  const c=S.cart.find(x=>x.id===p.id);if(c&&c.qty>=p.quantity){toast('وصلت لآخر كمية متاحة: '+p.name);return}
  addC(p.id);toast('✔ '+p.name)},{title:'امسح المنتجات للبيع'})}
function scanBuy(){scanOpen(code=>{const p=S.products.find(x=>x.barcode&&x.barcode===code);
  if(p){const s=$('#bp');if(s)s.value=p.id;toast('✔ '+p.name);return 'close'}
  scanClose();toast('باركود جديد: ضيف المنتج');prodForm(null,code)},{title:'امسح المنتج للشراء'})}
function sqKey(e){if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;const p=S.products.find(x=>x.barcode&&x.barcode===v);
 if(p&&p.quantity>0){addC(p.id);toast('✔ '+p.name)}else if(p)toast('خلص من المخزون: '+p.name)}

/* ---------- الحجوزات والعربون ---------- */
async function resv(){
 if(!isPro())return lockView('🏍️ الحجوزات والعربون');
 $('#main').innerHTML=`${back}<h3>🏍️ الحجوزات والعربون</h3><p class=mut>جاري التحميل...</p>`;

 S.rv=r.data||[];const A=S.rv.filter(x=>x.status==='active'),H=S.rv.filter(x=>x.status!=='active');
 const card=x=>{const tot=x.agreed_price*x.quantity,rem=tot-x.deposit;
  return `<div class=card><div class=row style="justify-content:space-between;margin:0"><b>${esc(x.customer_name)}</b><small dir=ltr>${esc(x.phone||'')}</small></div>
<div class=row style="margin:6px 0;gap:10px">${thumb(x.products)}<div><b>${esc(x.products?x.products.name:'—')}</b> × ${fmt(x.quantity)}<br><small>السعر ${fmt(tot)} • عربون ${fmt(x.deposit)} • <b class=neg>الباقي ${fmt(rem)}</b></small></div></div>
${x.note?`<small class=mut>${esc(x.note)}</small><br>`:''}<small class=mut>${new Date(x.created_at).toLocaleDateString('ar-EG')}</small>
${x.status==='active'?`<div style="display:flex;gap:6px;margin-top:8px"><button class=btn style="margin:0;flex:2" onclick="resvDone('${x.id}')">✅ إتمام البيع</button><button class="btn red" style="margin:0;flex:1" onclick="resvCancel('${x.id}')">إلغاء</button></div>`:`<br><b class="${x.status==='completed'?'pos':'neg'}">${x.status==='completed'?'✅ تم البيع':'❌ ملغي'}</b>`}</div>`};
 $('#main').innerHTML=`${back}<h3>🏍️ الحجوزات والعربون</h3><button class=btn onclick=resvForm()>+ حجز جديد</button><h4>حجوزات شغالة (${A.length})</h4>${A.map(card).join('')||'<p class=mut>مفيش حجوزات شغالة</p>'}${H.length?`<h4>السجل</h4>${H.slice(0,15).map(card).join('')}`:''}`}

 modal(`<h3>حجز جديد</h3><label>المنتج</label><select id=rp onchange=rpSet()>${P.map(p=>`<option value="${p.id}">${esc(p.name)} (متاح ${fmt(p.quantity)})</option>`).join('')}</select>

/* ---------- المبيعات والمرتجع ---------- */
const ymdNow=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let SLD=null;
const RMETH={cash:'💵 كاش',instapay:'📲 إنستاباي',wallet:'👛 محفظة',credit:'📒 خصم من الدين'};
async function sales(){
 if(!isPro())return lockView('↩️ المبيعات والمرتجع');
 SLD=SLD||ymdNow();const a=new Date(SLD+'T00:00:00'),b=new Date(a.getTime()+864e5);
 const head=`${back}<h3>↩️ المبيعات والمرتجع</h3><input type=date id=sld value="${SLD}" onchange="SLD=this.value;sales()">`;
 $('#main').innerHTML=head+'<p class=mut>جاري التحميل...</p>';
 const r=await sb.from('sales').select('id,created_at,customer_name,customer_id,total,paid_amount,payment_method,sale_items(id,quantity,unit_price,product_id,products(name))').eq('business_id',S.biz.id).gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).order('created_at',{ascending:false});
 if(r.error){$('#main').innerHTML=head+`<div class=card><small>${esc(r.error.message)}</small></div>`;return}
 const L=r.data||[],ids=[];L.forEach(x=>(x.sale_items||[]).forEach(i=>ids.push(i.id)));
 const rt=ids.length?await sb.from('sale_return_items').select('sale_item_id,quantity').in('sale_item_id',ids):{data:[]};
 const done={};(rt.data||[]).forEach(x=>done[x.sale_item_id]=(done[x.sale_item_id]||0)+Number(x.quantity));S.slx=L;S.slDone=done;
 const tm=x=>new Date(x).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
 $('#main').innerHTML=head+(L.map(x=>{const it=x.sale_items||[],can=it.some(i=>i.quantity-(done[i.id]||0)>0);
  return `<div class=card><div class=row style="justify-content:space-between;margin:0"><b>${tm(x.created_at)}${x.customer_name?' • '+esc(x.customer_name):''}</b><b>${fmt(x.total)}</b></div>${it.map(i=>`<div class=trow><span>${esc(i.products?i.products.name:'—')} × ${fmt(i.quantity)}${done[i.id]?` <small class=neg>(رجع ${fmt(done[i.id])})</small>`:''}</span><small>${fmt(i.unit_price)}</small></div>`).join('')}${can?`<button class="btn sec" style="margin:8px 0 0" onclick="returnForm('${x.id}')">↩️ مرتجع</button>`:'<small class=mut>اتسجّل مرتجع بالكامل</small>'}</div>`}).join('')||'<p class=mut>مفيش مبيعات في اليوم ده</p>')}
const rmethChips=()=>Object.keys(RMETH).filter(k=>k!=='credit'||S.rcust).map(k=>`<a class="${S.rmeth===k?'on':''}" onclick="S.rmeth='${k}';$('#rmeth').innerHTML=rmethChips()">${RMETH[k]}</a>`).join('');
function returnForm(id){const x=S.slx.find(q=>q.id===id);S.rcust=!!x.customer_id;S.rmeth=(x.customer_id&&x.paid_amount!=null&&+x.paid_amount<+x.total)?'credit':'cash';
 const rows=(x.sale_items||[]).map(i=>({i,rem:i.quantity-(S.slDone[i.id]||0)})).filter(q=>q.rem>0);
 modal(`<h3>↩️ مرتجع</h3>${rows.map(q=>`<div class=trow><span>${esc(q.i.products?q.i.products.name:'—')}<br><small>اتباع ${fmt(q.i.quantity)} بـ ${fmt(q.i.unit_price)} • المتاح للإرجاع ${fmt(q.rem)}</small></span><input type=number min=0 max=${q.rem} value=0 data-ri="${q.i.id}" data-p="${q.i.unit_price}" style="width:80px;margin:0" oninput=retTot()></div>`).join('')}
<div class=card><div class=trow style="border:0"><span>قيمة المرتجع</span><b id=rtot>0</b></div></div>
<label>الفلوس تترجّع إزاي؟</label><div class=chipbar id=rmeth>${rmethChips()}</div>
<label>ملاحظة (اختياري)</label><input id=rnote><button class=btn onclick="doReturn('${id}',false)">تأكيد المرتجع</button><button class="btn sec" onclick="doReturn('${id}',true)">↩️ مرتجع + بيع جديد (استبدال)</button><small class=mut>المنتج بيرجع للمخزون، والمبيعات والأرباح بتتعدل.</small>`)}
function retTot(){let t=0;document.querySelectorAll('[data-ri]').forEach(e=>{let q=+e.value||0;if(q>+e.max){q=+e.max;e.value=q}t+=q*+e.dataset.p});$('#rtot').textContent=fmt(t)}
async function doReturn(id,ex){const items=[...document.querySelectorAll('[data-ri]')].map(e=>({sale_item_id:e.dataset.ri,quantity:+e.value||0})).filter(q=>q.quantity>0);
 if(!items.length)return toast('اختار كمية للإرجاع');
 const r=await sb.rpc('make_return',{p_business:S.biz.id,p_sale:id,p_items:items,p_method:S.rmeth||'cash',p_note:$('#rnote').value.trim()||null});
 if(r.error)return toast(r.error.message);closeM();toast('تم المرتجع ✅');await loadData();ex?go('sell'):sales()}

 if(x.action==='price_override')return `🏷️ باع "${esc(d.name)}" بـ ${fmt(d.sold)} بدل ${fmt(d.list)} (× ${fmt(d.qty)})`;
 if(x.action==='return')return `↩️ مرتجع بقيمة ${fmt(d.amount)} (${RMETH[d.method]||esc(d.method)})${d.customer?' • '+esc(d.customer):''}`;
 if(x.action==='delete'){const t={products:'منتج',expenses:'مصروف',customers:'عميل',customer_payments:'دفعة عميل',supplier_payments:'دفعة مورد'}[x.entity]||esc(x.entity);return `🗑️ مسح ${t}: ${esc(d.name||d.title||'')}${d.amount?' ('+fmt(d.amount)+')':''}`}

/* ---------- العروض والخصومات ---------- */
async function loadPromos(){S.promos=[];if(!isBiz())return;const r=await sb.from('promotions').select('*').eq('business_id',S.biz.id).eq('active',true);const n=new Date();
 S.promos=(r.data||[]).filter(p=>(!p.starts_at||new Date(p.starts_at)<=n)&&(!p.ends_at||new Date(p.ends_at)>=n))}
function promoPrice(p,qty){let best=+p.sale_price,tag=null;
 (S.promos||[]).forEach(x=>{if((x.product_id&&x.product_id!==p.id)||qty<+x.min_qty)return;const v=x.kind==='percent'?p.sale_price*(1-x.value/100):p.sale_price-x.value;if(v>=0&&v<best){best=Math.round(v*100)/100;tag=x.name}});return{price:best,tag}}
const promoDesc=x=>`${x.kind==='percent'?fmt(x.value)+'%':fmt(x.value)+' جنيه'} خصم على ${x.product_id?esc((S.products.find(p=>p.id===x.product_id)||{}).name||'منتج'):'كل المنتجات'}${+x.min_qty>1?' (من '+fmt(x.min_qty)+' قطع)':''}${x.ends_at?' • لحد '+new Date(x.ends_at).toLocaleDateString('ar-EG'):''}`;
async function promos(){
 if(!canEdit())return;if(!isBiz())return lockView('🏷️ العروض والخصومات','Business');
 $('#main').innerHTML=`${back}<h3>🏷️ العروض والخصومات</h3><p class=mut>جاري التحميل...</p>`;
 const r=await sb.from('promotions').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false});
 if(r.error){$('#main').innerHTML=`${back}<div class=card><small>${esc(r.error.message)}<br>لو الجدول مش موجود، شغّل ملف abuda_V2.sql.</small></div>`;return}
 $('#main').innerHTML=`${back}<h3>🏷️ العروض والخصومات</h3><small class=mut>العرض بيتطبق لوحده على السلة في شاشة البيع، ولو غيّرت السعر بإيدك بيفضل سعرك.</small><button class=btn onclick="promoForm()">+ عرض جديد</button>${(r.data||[]).map(x=>`<div class=card><b>${esc(x.name)}</b> ${x.active?'':'<small class=neg>(موقوف)</small>'}<br><small>${promoDesc(x)}</small><div style="display:flex;gap:6px;margin-top:8px"><button class="btn sec" style="margin:0;flex:1" onclick="togPromo('${x.id}',${!x.active})">${x.active?'إيقاف':'تشغيل'}</button><button class="btn red" style="margin:0;flex:1" onclick="delPromo('${x.id}')">حذف</button></div></div>`).join('')||'<p class=mut>مفيش عروض لسه</p>'}`}
function promoForm(){modal(`<h3>عرض جديد</h3><label>اسم العرض (بيظهر في السلة)</label><input id=pmn placeholder="مثلاً: خصم الجمعة"><div class=grid><div><label>نوع الخصم</label><select id=pmk><option value=percent>نسبة %</option><option value=amount>مبلغ ثابت</option></select></div><div><label>القيمة</label><input id=pmv type=number></div></div>
<label>ينطبق على</label><select id=pmp><option value="">كل المنتجات</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
<div class=grid><div><label>من كمية</label><input id=pmq type=number value=1></div><div><label>ينتهي في (اختياري)</label><input id=pme type=date></div></div><button class=btn onclick=savePromo()>حفظ العرض</button>`)}
async function savePromo(){const name=$('#pmn').value.trim(),v=+$('#pmv').value;if(!name||!(v>0))return toast('اكتب اسم العرض والقيمة');
 if($('#pmk').value==='percent'&&v>100)return toast('النسبة لا تزيد عن 100');
 const e=$('#pme').value;const r=await sb.from('promotions').insert({business_id:S.biz.id,name,kind:$('#pmk').value,value:v,product_id:$('#pmp').value||null,min_qty:+$('#pmq').value||1,ends_at:e?new Date(e+'T23:59:59').toISOString():null});
 if(r.error)return toast(r.error.message);closeM();toast('تم حفظ العرض ✅');promos()}
async function togPromo(id,v){await sb.from('promotions').update({active:v}).eq('id',id);promos()}
async function delPromo(id){if(!confirm('حذف العرض؟'))return;await sb.from('promotions').delete().eq('id',id);promos()}

const views={home,prods,sell,reports,more,buy,exp,team,branches,upgrade,admin,subs,customers,shop,staff,resv,sales,suppliers,shiftv,audit,promos};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(newPass,600);if(ev==='SIGNED_OUT'){S={biz:null,role:null,user:null,fields:[],products:[],cart:[],tab:'home'};authView()}});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?loadBiz():authView()})();
</script>
