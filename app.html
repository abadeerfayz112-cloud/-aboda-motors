<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AbodA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--card:#141417;--tx:#eceef1;--mut:#8b8f98;--pri:#e11d2e;--bd:#26262b;--neg:#ff6b6b;--pos:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#000;color:#fff;border-bottom:2px solid var(--pri);position:sticky;top:0;z-index:5}
header img{height:34px;display:block}
.badge{background:var(--pri);border-radius:99px;padding:2px 10px;font-size:13px;text-transform:uppercase}
main{padding:14px 14px 100px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--mut);cursor:pointer}
nav a i{display:block;font-style:normal;font-size:20px}
nav a.on{color:var(--pri);font-weight:700}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
.btn{width:100%;padding:13px;margin:10px 0;border:0;border-radius:10px;background:linear-gradient(135deg,#e11d2e,#a30f1c);box-shadow:0 0 14px #e11d2e44;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:#3a1114;border:1px solid var(--pri);box-shadow:none}
button{font:inherit}
.card,.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.end{text-align:left;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid small{display:block;color:var(--mut)}
.grid b{font-size:18px}
.card h4{margin:0 0 8px}
.mut,small{color:var(--mut)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{background:#1d1d22;border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;margin-top:6px}
.row button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.auth{max-width:380px;margin:5vh auto;padding:20px;text-align:center}
.auth h1{margin-bottom:0}
.auth .emb{width:78%;max-width:300px;display:block;margin:0 auto}
.auth .nm{width:70%;max-width:260px;display:block;margin:-6px auto 10px}
.auth a,a{color:var(--pri);cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
#toast{position:fixed;top:70px;inset-inline:16px;background:#1d1d22;border:1px solid var(--pri);color:#fff;padding:12px;border-radius:10px;z-index:30;display:none;text-align:center}

#ad{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}
#ad video{max-width:100%;max-height:82vh}
#ad .bar{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px}
#ad .tag{background:#ffffff22;border-radius:6px;padding:2px 8px;font-size:12px}
#ad button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:99px;padding:8px 16px}
.chipbar{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
.chipbar a{white-space:nowrap;padding:7px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx)}
.chipbar a.on{background:var(--pri);border-color:var(--pri);color:#fff}
.nav2{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.nav2 button{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0}
.bars div{flex:1;background:var(--pri);border-radius:3px 3px 0 0;min-height:2px}
hr{border:0;border-top:1px solid var(--bd);margin:8px 0}
@media(min-width:900px){
 nav{inset-block:58px 0;inset-inline:auto;inset-inline-start:0;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-inline-end:1px solid var(--bd);padding:10px 0}
 nav a{display:flex;flex:none;align-items:center;gap:12px;font-size:15px;padding:14px 20px;text-align:start}
 nav a i{display:inline;font-size:20px}
 main{margin-inline-start:200px;max-width:none;padding:20px 28px 40px}
 #pl{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
 .sheet{max-width:560px;border-radius:18px;margin:auto}
 #modal{align-items:center}
}
</style>
</head>
<body>
<div id="app"></div><div id="modal" onclick="closeM(event)"></div><div id="toast"></div>
<script>
const U='https://qicrekcfewsfvhbauyhc.supabase.co',K='sb_publishable_GtGCblg9OuZFtMThlrYHHQ_cQBscNwM';
const sb=supabase.createClient(U,K);
const TYPES={clothing:'ملابس وأحذية',electronics:'إلكترونيات وموبايلات',motorcycles:'موتوسيكلات وقطع غيار',supermarket:'سوبر ماركت وأدوات منزلية',wholesale:'معارض ومخازن وجملة',other:'نشاط آخر'};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
let S={biz:null,role:null,user:null,fields:[],products:[],cart:[],tab:'home'},mode='in';
const plan=()=>S.biz.plan_id!=='free'&&S.biz.plan_expires_at&&new Date(S.biz.plan_expires_at)>new Date()?S.biz.plan_id:'free';
const isPro=()=>plan()!=='free',isBiz=()=>plan()==='business';
const canEdit=()=>['owner','manager'].includes(S.role);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
function modal(h){const m=$('#modal');m.innerHTML=`<div class=sheet>${h}</div>`;m.classList.add('on')}
function closeM(e){if(e&&e.target.id!=='modal')return;$('#modal').classList.remove('on');$('#modal').innerHTML=''}

/* ---------- الدخول ---------- */
function authView(){app.innerHTML=`<div class=auth><img class=emb src=logo-emblem.webp alt=""><img class=nm src=logo-name.webp alt=AbodA><p class=mut>إدارة محلك بسهولة</p>
<input id=em type=email placeholder="الإيميل" dir=ltr><input id=pw type=password placeholder="كلمة السر (6 حروف على الأقل)" dir=ltr>
<button class=btn onclick=doAuth()>${mode==='in'?'دخول':'إنشاء حساب'}</button>
${mode==='in'?'<a onclick=forgot()>نسيت كلمة السر؟</a><br><br>':''}<a onclick="mode=mode==='in'?'up':'in';authView()">${mode==='in'?'مفيش حساب؟ سجل دلوقتي':'عندي حساب بالفعل'}</a></div>`}
async function forgot(){const email=$('#em').value.trim();if(!email)return toast('اكتب الإيميل الأول');
 const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});toast(r.error?r.error.message:'اتبعتلك رابط لتغيير كلمة السر على الإيميل')}
function newPass(){modal(`<h3>كلمة سر جديدة</h3><input id=np type=password dir=ltr placeholder="كلمة السر الجديدة (6 حروف على الأقل)"><button class=btn onclick=savePass()>حفظ</button>`)}
async function savePass(){const r=await sb.auth.updateUser({password:$('#np').value});if(r.error)return toast(r.error.message);closeM();toast('تم تغيير كلمة السر ✅')}
async function doAuth(){const email=$('#em').value.trim(),password=$('#pw').value;
 const r=mode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('اتبعتلك رسالة تأكيد على الإيميل، أكدها وبعدين ادخل');
 loadBiz()}
function setupView(){app.innerHTML=`<div class=auth><img class=nm src=logo-name.webp alt=AbodA style="margin-top:0"><h2>أهلاً بيك 👋</h2><p class=mut>عرّفنا على محلك</p>
<input id=bn placeholder="اسم المحل أو المعرض"><select id=bt>${Object.entries(TYPES).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select>
<button class=btn onclick=mkBiz()>ابدأ</button><a onclick="sb.auth.signOut()">خروج</a></div>`}
async function mkBiz(){const r=await sb.rpc('create_business',{p_name:$('#bn').value,p_type:$('#bt').value});if(r.error)return toast(r.error.message);loadBiz()}

/* ---------- تحميل البيانات ---------- */
async function loadBiz(){
 const {data:{user}}=await sb.auth.getUser();S.user=user;
 const {data,error}=await sb.from('members').select('role,businesses(*)').eq('user_id',user.id).limit(1);
 if(error)return toast(error.message);
 if(!data.length)return setupView();
 S.role=data[0].role;S.biz=data[0].businesses;
 const ad=await sb.from('app_admins').select('user_id').eq('user_id',user.id);S.admin=!!(ad.data&&ad.data.length);
 await loadData();render();loadAds().then(()=>setTimeout(maybeAd,4000))}
async function loadData(){
 const [f,p]=await Promise.all([sb.from('field_definitions').select('*').eq('business_id',S.biz.id).order('sort_order'),sb.from('products').select('*').eq('business_id',S.biz.id).order('name')]);
 S.fields=f.data||[];S.products=p.data||[]}
function render(){
 app.innerHTML=`<header><img src=logo-name.webp alt=AbodA><span><small style="color:#c9ccd3;margin-inline-end:8px">${esc(S.biz.name)}</small><span class=badge onclick="page('upgrade')" style="cursor:pointer">${plan()}</span></span></header><main id=main></main>
<nav>${[['home','🏠','الرئيسية'],['prods','📦','المنتجات'],['sell','🛒','بيع']].concat(canEdit()?[['reports','📊','التقارير']]:[]).concat([['more','⚙️','المزيد']]).map(t=>`<a class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</a>`).join('')}</nav>`;
 views[S.tab]()}
function go(t){S.tab=t;render();if(t==='home'||t==='reports')setTimeout(maybeAd,1500)}

/* ---------- الرئيسية ---------- */
const rng=(a,b)=>sb.rpc('report_summary',{p_business:S.biz.id,p_from:a.toISOString(),p_to:b.toISOString()}).then(r=>(r.data&&r.data[0])||{});
async function home(){
 $('#main').innerHTML='<p class=mut>جاري التحميل...</p>';
 const bz=await sb.from('businesses').select('*').eq('id',S.biz.id).single();if(bz.data){S.biz=bz.data;const bd=document.querySelector('.badge');if(bd)bd.textContent=plan()}
 const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);
 const c=new Date(a.getFullYear(),a.getMonth(),1),d=new Date(a.getFullYear(),a.getMonth()+1,1);
 const ed=canEdit(),pro=plan()!=='free';
 const [t,mo]=await Promise.all([rng(a,b),pro&&ed?rng(c,d):null]);S.last=t;
 const num=(l,v,x)=>`<div ${x||''}><small>${l}</small><b ${x&&v<0?'class=neg':''}>${fmt(v)}</b></div>`;
 const today=`<div class=card><h4>اليوم</h4><div class=grid>${num('المبيعات',t.revenue)}${ed?num('المصروفات',t.expenses):''}${ed?`<div onclick="profitWhy(S.last)" style="cursor:pointer"><small>صافي الربح ⓘ</small><b class="${t.net_profit<0?'neg':'pos'}">${fmt(t.net_profit)}</b></div>`:''}<div><small>عدد العمليات</small><b>${t.sales_count||0}</b></div></div>
${ed?`<button class="btn sec" onclick=dayDetail()>📋 تفاصيل أرباح اليوم</button>`:''}</div>`;
 const month=!ed?'':pro?`<div class=card><h4>الشهر ده</h4><div class=grid>${num('المبيعات',mo.revenue)}${num('المصروفات',mo.expenses)}<div onclick="profitWhy(S.mo)" style="cursor:pointer"><small>صافي الربح ⓘ</small><b class="${mo.net_profit<0?'neg':'pos'}">${fmt(mo.net_profit)}</b></div>${num('عدد العمليات',mo.sales_count||0)}</div><button class="btn sec" onclick="go('reports')">📊 كل التقارير (أسبوع / سنة / أي يوم فات)</button></div>`:`<div class=card onclick="page('upgrade')" style="cursor:pointer"><h4>📊 التقارير الكاملة 🔒</h4><small>الأسبوع والشهر والسنة وأي يوم فات. متاحة في Pro وBusiness، وبدون إعلانات. <b style="color:var(--pri)">اضغط للترقية</b></small></div>`;
 S.mo=mo;
 $('#main').innerHTML=banner()+today+month+invCard()}
function invCard(){const P=S.products,q=p=>Math.max(0,+p.quantity),u=P.reduce((s,p)=>s+q(p),0),vc=P.reduce((s,p)=>s+q(p)*p.cost_price,0),vs=P.reduce((s,p)=>s+q(p)*p.sale_price,0);
 const out=P.filter(p=>p.quantity<=0),low=P.filter(p=>p.quantity>0&&p.quantity<=p.min_quantity);
 return `<div class=card><h4>📦 ملخص المخزون</h4><div class=grid><div><small>عدد الأصناف</small><b>${P.length}</b></div><div><small>إجمالي القطع</small><b>${fmt(u)}</b></div>${canEdit()?`<div><small>قيمته بسعر الشراء</small><b>${fmt(vc)}</b></div><div><small>قيمته بسعر البيع</small><b>${fmt(vs)}</b></div>`:''}</div>
${out.length?`<h4 style="margin-top:12px">🚫 نفدت (${out.length})</h4>${out.slice(0,10).map(p=>`<div class=row style="justify-content:space-between"><span>${esc(p.name)}</span><b class=neg>0</b></div>`).join('')}`:''}
${low.length?`<h4 style="margin-top:12px">⚠️ كميتها قليلة (${low.length})</h4>${low.slice(0,10).map(p=>`<div class=row style="justify-content:space-between"><span>${esc(p.name)}</span><span><b class=neg>${fmt(p.quantity)}</b> <small>من حد ${fmt(p.min_quantity)}</small></span></div>`).join('')}`:''}
${!out.length&&!low.length&&P.length?'<p class=mut>✅ مفيش منتجات ناقصة</p>':''}${!P.length?'<p class=mut>ضيف منتجاتك من تاب المنتجات</p>':''}</div>`}
function profitWhy(t){t=t||{};const r=(l,v,c)=>`<div class=row style="justify-content:space-between"><span>${l}</span><b ${c?`class="${c}"`:''}>${fmt(v)}</b></div>`;
 modal(`<h3>إزاي بنحسب صافي الربح؟</h3><div class=card>${r('المبيعات',t.revenue)}${r('− تكلفة البضاعة اللي اتباعت',t.cost)}<hr>${r('= ربح المبيعات',t.gross_profit)}${r('− المصروفات',t.expenses)}<hr>${r('= صافي الربح',t.net_profit,t.net_profit<0?'neg':'pos')}</div><small>تكلفة البضاعة = سعر شراء كل قطعة وقت بيعها. المشتريات نفسها مش بتتخصم هنا، لأنها بضاعة في المخزون لحد ما تتباع.</small>`)}
async function dayDetail(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(a);b.setDate(b.getDate()+1);
 const [it,ex]=await Promise.all([sb.rpc('report_items',{p_business:S.biz.id,p_from:a.toISOString(),p_to:b.toISOString()}),sb.from('expenses').select('*').eq('business_id',S.biz.id).gte('created_at',a.toISOString()).lt('created_at',b.toISOString())]);
 const rows=it.data||[],e2=ex.data||[],tm=x=>new Date(x).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
 modal(`<h3>📋 تفاصيل أرباح اليوم</h3>${rows.map(r=>`<div class=item style="cursor:default"><div><b>${esc(r.name)}</b><br><small>${fmt(r.quantity)} × ${fmt(r.unit_price)} • ${tm(r.created_at)}${r.customer_name?' • '+esc(r.customer_name):''}</small></div><b class="${r.profit<0?'neg':'pos'}">${fmt(r.profit)}</b></div>`).join('')||'<p class=mut>مفيش مبيعات النهارده لسه</p>'}
${e2.length?`<h4>المصروفات</h4>${e2.map(e=>`<div class=row style="justify-content:space-between"><span>${esc(e.title)}</span><b class=neg>−${fmt(e.amount)}</b></div>`).join('')}`:''}
<button class="btn sec" onclick=profitWhy(S.last)>إزاي اتحسب صافي الربح؟</button>`)}

/* ---------- المنتجات ---------- */
function prods(){$('#main').innerHTML=`<input id=q placeholder="🔍 بحث بالاسم أو الباركود" oninput=plist()>${canEdit()?'<button class=btn onclick="prodForm()">+ منتج جديد</button>':''}${isPro()&&canEdit()?'<button class="btn sec" onclick=expProds()>📤 تصدير المنتجات (Excel)</button>':''}<div id=pl></div>`;plist()}
function plist(){const q=($('#q').value||'').toLowerCase();
 $('#pl').innerHTML=S.products.filter(p=>(p.name+' '+(p.barcode||'')).toLowerCase().includes(q)).map(p=>`<div class=item ${canEdit()?`onclick="prodForm('${p.id}')"`:''}><div><b>${esc(p.name)}</b><div class=chips>${Object.entries(p.attributes||{}).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div></div><div class=end><b>${fmt(p.sale_price)}</b><small class="${p.quantity<=p.min_quantity?'neg':''}">الكمية ${fmt(p.quantity)}</small></div></div>`).join('')||'<p class=mut>مفيش منتجات لسه</p>'}
function fin(f,v){const o=f.field_type;
 if(o==='select')return `<select data-fid="${f.id}"><option value="">—</option>${(f.options||[]).map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 return `<input data-fid="${f.id}" type="${o==='number'?'number':o==='date'?'date':'text'}" value="${esc(v)}">`}
function prodForm(id){const p=S.products.find(x=>x.id===id)||{attributes:{}};
 modal(`<h3>${id?'تعديل منتج':'منتج جديد'}</h3><label>الاسم</label><input id=pn value="${esc(p.name)}"><label>الباركود (اختياري)</label><input id=pb value="${esc(p.barcode)}">
<div class=grid><div><label>سعر الشراء</label><input id=pc type=number value="${p.cost_price??''}"></div><div><label>سعر البيع</label><input id=ps type=number value="${p.sale_price??''}"></div>
<div><label>الكمية</label><input id=pq type=number value="${p.quantity??''}" ${id?'disabled':''}></div><div><label>تنبيه عند أقل من</label><input id=pm type=number value="${p.min_quantity??''}"></div></div>
${id?'<small>الكمية بتتعدل تلقائي مع البيع والشراء</small>':''}
${S.fields.map(f=>`<label>${esc(f.name)}</label>${fin(f,p.attributes[f.name])}`).join('')}
<button class=btn onclick="saveProd('${id||''}')">حفظ</button>${id?`<button class="btn red" onclick="delProd('${id}')">حذف المنتج</button>`:''}`)}
async function saveProd(id){const a={};
 S.fields.forEach(f=>{const e=document.querySelector(`[data-fid="${f.id}"]`);if(e&&e.value!=='')a[f.name]=f.field_type==='number'?Number(e.value):e.value});
 const row={business_id:S.biz.id,name:$('#pn').value.trim(),barcode:$('#pb').value.trim()||null,cost_price:+$('#pc').value||0,sale_price:+$('#ps').value||0,min_quantity:+$('#pm').value||0,attributes:a};
 if(!row.name)return toast('اكتب اسم المنتج');
 if(!id)row.quantity=+$('#pq').value||0;
 const r=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);
 if(r.error)return toast(r.error.message);closeM();await loadData();prods()}
async function delProd(id){if(!confirm('حذف المنتج؟'))return;const r=await sb.from('products').delete().eq('id',id);
 if(r.error)return toast('مينفعش تحذف منتج اتباع قبل كده');closeM();await loadData();prods()}

/* ---------- البيع ---------- */
async function loadCust(){if(!isPro())return;const r=await sb.from('customers').select('*').eq('business_id',S.biz.id).order('name');S.cust=r.data||[]}
function custOpts(sel){return '<option value="">عميل غير مسجل</option>'+(S.cust||[]).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')+'<option value="__new">➕ عميل جديد...</option>'}
function cidCh(e){if(e.value==='__new'){e.value='';custForm(id=>loadCust().then(()=>{const x=$('#cid');if(x)x.innerHTML=custOpts(id)}))}}
function sell(){$('#main').innerHTML=`<input id=sq placeholder="🔍 ابحث عن منتج أو امسح الباركود" oninput=slist()><div id=sl></div><h4>السلة</h4>${isPro()?'<select id=cid onchange=cidCh(this)><option value="">عميل غير مسجل</option></select>':''}<input id=cu placeholder="اسم العميل (اختياري)"><div id=cart></div>`;slist();rcart();if(isPro())loadCust().then(()=>{const e=$('#cid');if(e)e.innerHTML=custOpts()})}
function slist(){const q=$('#sq').value.toLowerCase();
 const r=q?S.products.filter(p=>p.quantity>0&&(p.name+' '+(p.barcode||'')).toLowerCase().includes(q)).slice(0,8):[];
 $('#sl').innerHTML=r.map(p=>`<div class=item onclick="addC('${p.id}')"><b>${esc(p.name)}</b><small>${fmt(p.sale_price)} • متاح ${fmt(p.quantity)}</small></div>`).join('')}
function addC(id){const p=S.products.find(x=>x.id===id),c=S.cart.find(x=>x.id===id);
 if(c){if(c.qty<p.quantity)c.qty++}else S.cart.push({id,name:p.name,qty:1,price:p.sale_price,max:p.quantity});
 $('#sq').value='';slist();rcart()}
function cq(i,d){const c=S.cart[i];c.qty=Math.max(1,Math.min(c.max,c.qty+d));rcart()}
function rcart(){const t=S.cart.reduce((s,c)=>s+c.qty*c.price,0);
 $('#cart').innerHTML=S.cart.length?S.cart.map((c,i)=>`<div class=item style="cursor:default"><div><b>${esc(c.name)}</b><div class=row><input type=number value="${c.price}" onchange="S.cart[${i}].price=+this.value;rcart()" style="width:95px;margin:0"><button onclick="cq(${i},-1)">−</button><b>${c.qty}</b><button onclick="cq(${i},1)">+</button></div></div><a onclick="S.cart.splice(${i},1);rcart()">✕</a></div>`).join('')+`<div class=card><div class=row style="justify-content:space-between"><b>الإجمالي</b><b style="font-size:22px">${fmt(t)}</b></div></div>${isPro()?`<label>المدفوع دلوقتي (سيبه فاضي لو دفع كله)</label><input type=number id=paid value="${S.paid??''}" oninput="S.paid=this.value" placeholder="${fmt(t)}"><small class=mut>لو دفع أقل، الباقي بيتسجل آجل على العميل المختار.</small>`:''}<button class=btn onclick=doSale()>تأكيد البيع</button>`:'<p class=mut>السلة فاضية</p>'}
async function doSale(){const items=S.cart.map(c=>({product_id:c.id,quantity:c.qty,unit_price:c.price})),tot=S.cart.reduce((x,c)=>x+c.qty*c.price,0);
 const cid=(isPro()&&$('#cid')&&$('#cid').value)||null,paid=isPro()&&S.paid!==undefined&&S.paid!==''&&S.paid!==null?+S.paid:null;
 if(paid!==null&&paid<tot&&!cid)return toast('اختار العميل عشان الباقي يتسجل آجل');
 const r=await sb.rpc('make_sale',{p_business:S.biz.id,p_customer:$('#cu').value,p_items:items,p_customer_id:cid,p_paid:paid});
 if(r.error)return toast(r.error.message);S.cart=[];S.paid='';toast('تم تسجيل البيع ✅');await loadData();sell()}

${S.role==='owner'?'<button class="btn" onclick="page(\'upgrade\')">⭐ الباقات والاشتراك</button>':''}${S.admin?'<button class="btn sec" onclick="page(\'admin\')">👑 لوحة المدير</button>':''}

const back='<a onclick="go(\'more\')">→ رجوع</a>';

 const r=await sb.from('purchases').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false}).limit(15);
 $('#bl').innerHTML=(r.data||[]).map(x=>`<div class=item style="cursor:default"><div><b>${esc(x.supplier_name||'بدون مورد')}</b><br><small>${new Date(x.created_at).toLocaleDateString('ar-EG')}</small></div><b>${fmt(x.total)}</b></div>`).join('')||'<p class=mut>لسه مفيش</p>'}
async function doBuy(){const q=+$('#bq').value,c=+$('#bc').value;if(!(q>0)||!(c>=0)||$('#bc').value==='')return toast('اكتب الكمية والسعر');
 const r=await sb.rpc('make_purchase',{p_business:S.biz.id,p_supplier:$('#bs').value,p_items:[{product_id:$('#bp').value,quantity:q,unit_cost:c}]});

<h4>حقل جديد</h4><input id=fn placeholder="اسم الحقل (مثلاً: اللون)"><select id=ft><option value=text>نص</option><option value=number>رقم</option><option value=date>تاريخ</option><option value=select>قائمة اختيارات</option></select><input id=fo placeholder="الاختيارات مفصولة بفاصلة (للقائمة فقط)"><button class=btn onclick=addF()>إضافة</button>`)}

/* ---------- الباقات والدفع ---------- */
function banner(){if(S.biz.plan_id==='free'||!S.biz.plan_expires_at)return '';
 const d=Math.ceil((new Date(S.biz.plan_expires_at)-new Date())/864e5);
 if(d>5)return '';
 return `<div class=card onclick="page('upgrade')" style="cursor:pointer;border-color:var(--pri)"><b>${d>0?`⏰ اشتراكك ينتهي بعد ${d} يوم`:'⚠️ اشتراكك انتهى'}</b><br><small>اضغط للتجديد وكمل من غير إعلانات</small></div>`}
const STAT={pending:'⏳ قيد المراجعة',approved:'✅ تم التفعيل',rejected:'❌ مرفوض'};
async function upgrade(){
 $('#main').innerHTML=`${back}<h3>الباقات</h3><p class=mut>جاري التحميل...</p>`;
 const [bz,pl,st,rq]=await Promise.all([sb.from('businesses').select('*').eq('id',S.biz.id).single(),sb.from('plans').select('*').order('sort_order'),sb.from('app_settings').select('*'),sb.from('payment_requests').select('*').eq('business_id',S.biz.id).order('created_at',{ascending:false}).limit(5)]);
 if(bz.data)S.biz=bz.data;
 S.plans=pl.data||[];S.set=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value]));
 const cur=plan(),ex=S.biz.plan_expires_at,reqs=rq.data||[],pend=reqs.some(x=>x.status==='pending');
 const feats=p=>['🚫 بدون إعلانات','📊 تقارير الأسبوع والشهر والسنة','📒 دفتر العملاء والبيع الآجل','📤 تصدير Excel','🛒 قائمة "اشتري إيه" للمنتجات الناقصة',`👥 حتى ${p.max_users} مستخدمين`,`🏬 ${p.max_branches>1?'حتى '+p.max_branches+' فروع (تقارير الفروع قريباً)':'فرع واحد'}`].concat(p.id==='business'?['🏆 أكتر المنتجات ربحاً','👔 تقرير أداء كل موظف','☁️ نسخة احتياطية لبياناتك','🔐 صلاحيات للموظفين','✅ كل مميزات Pro']:[]);
 $('#main').innerHTML=`${back}<h3>الباقات والاشتراك</h3>
<div class=card>باقتك الحالية: <b style="text-transform:uppercase">${cur}</b>${cur!=='free'&&ex?`<br><small>تنتهي في ${new Date(ex).toLocaleDateString('ar-EG')}</small>`:''}</div>
${pend?'<div class=card style="border-color:var(--pri)">⏳ عندك طلب دفع قيد المراجعة، هيتفعل بعد ما نتأكد من التحويل.</div>':''}
${S.plans.filter(p=>p.id!=='free').map(p=>`<div class=card ${p.id==='business'?'style="border-color:var(--pri)"':''}><div class=row style="justify-content:space-between"><h3 style="margin:0">${esc(p.name)}</h3><div><b style="font-size:22px">${fmt(p.price)}</b> <small>جنيه/شهر</small></div></div>
<div style="margin:8px 0;line-height:1.9">${feats(p).map(f=>`<div>${f}</div>`).join('')}</div>
${S.role==='owner'?`<button class=btn onclick="payForm('${p.id}')" ${pend?'disabled style="opacity:.5"':''}>${cur===p.id?'تجديد الاشتراك':'اشترك في '+esc(p.name)}</button>`:'<small>الاشتراك من صاحب المحل فقط</small>'}</div>`).join('')}
${reqs.length?`<h4>آخر طلباتك</h4>${reqs.map(x=>`<div class=item style="cursor:default"><div><b style="text-transform:uppercase">${esc(x.plan_id)}</b> • ${fmt(x.amount)} جنيه<br><small>${new Date(x.created_at).toLocaleDateString('ar-EG')}${x.admin_note?' • '+esc(x.admin_note):''}</small></div><small>${STAT[x.status]}</small></div>`).join('')}`:''}`}
function payForm(pid){const p=S.plans.find(x=>x.id===pid),w=S.set.payment_wallet_number||'';
 modal(`<h3>الدفع لباقة ${esc(p.name)}</h3>
<div class=card><b>1) حوّل ${fmt(p.price)} جنيه</b> على محفظة ${esc(S.set.payment_wallet_name||'أورانج كاش')} رقم:<div class=row style="justify-content:space-between;margin-top:8px"><b dir=ltr style="font-size:20px;letter-spacing:1px">${esc(w)}</b><button class="btn sec" style="width:auto;margin:0;padding:6px 14px" onclick="navigator.clipboard.writeText('${esc(w)}').then(()=>toast('تم نسخ الرقم'))">نسخ</button></div><small>تقدر تحوّل من أي مكان.</small></div>
<b>2) اكتب رقم العملية</b><input id=pref placeholder="رقم العملية" dir=ltr>
<b>3) صوّر إيصال التحويل</b><input id=pfile type=file accept="image/*">
<button class=btn id=pbtn onclick="submitPay('${pid}')">إرسال الطلب</button><small>بعد المراجعة (غالباً في نفس اليوم) بتتفعل الباقة 30 يوم وبتوصلك هنا.</small>`)}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b||f),'image/jpeg',.8)};i.onerror=()=>r(f);i.src=URL.createObjectURL(f)})}
async function submitPay(pid){const ref=$('#pref').value.trim(),f=$('#pfile').files[0];
 if(!ref)return toast('اكتب رقم العملية');if(!f)return toast('صوّر إيصال التحويل');
 const b=$('#pbtn');b.disabled=true;b.textContent='جاري الإرسال...';
 const blob=await shrink(f),path=`${S.user.id}/${Date.now()}.jpg`;
 const u=await sb.storage.from('receipts').upload(path,blob,{contentType:'image/jpeg'});
 if(u.error){b.disabled=false;b.textContent='إرسال الطلب';return toast('فشل رفع الصورة: '+u.error.message)}
 const r=await sb.from('payment_requests').insert({business_id:S.biz.id,plan_id:pid,reference:ref,receipt_path:path});
 if(r.error){b.disabled=false;b.textContent='إرسال الطلب';return toast(r.error.message)}
 closeM();toast('تم إرسال الطلب ✅');upgrade()}

<div><b style="text-transform:uppercase">${esc(x.plan_id)}</b> • ${fmt(x.amount)} جنيه • <small>${new Date(x.created_at).toLocaleString('ar-EG')}</small></div><div>رقم العملية: <b dir=ltr>${esc(x.reference)}</b></div>
<div style="display:flex;flex-direction:column;gap:2px;margin-top:6px"><button class="btn sec" style="margin:4px 0" onclick="showRec('${esc(x.receipt_path)}')">🧾 الإيصال</button>${x.status==='pending'?`<button class=btn style="margin:4px 0" onclick="okPay('${x.id}')">موافقة</button><button class="btn red" style="margin:4px 0" onclick="noPay('${x.id}')">رفض</button>`:''}</div></div>`).join('')||'<p class=mut>مفيش طلبات</p>'}
async function adList(){const r=await sb.from('ads').select('*').order('created_at',{ascending:false});
 $('#adl').innerHTML=(r.data||[]).map(a=>`<div class=item style="cursor:default"><div><b>${esc(a.title)}</b> <small>${esc(a.advertiser||'')}</small><br><small>👁 ${a.views} • 👆 ${a.clicks} • ${a.active?'شغال':'موقوف'}</small></div><div class=row><a onclick="togAd('${a.id}',${!a.active})">${a.active?'إيقاف':'تشغيل'}</a><a onclick="delAd('${a.id}')">حذف</a></div></div>`).join('')||'<p class=mut>مفيش إعلانات</p>'}
async function addAd(){const f=$('#af').files[0],t=$('#at').value.trim();if(!t||!f)return toast('اكتب العنوان واختار فيديو');if(f.size>8*1048576)return toast('الفيديو أكبر من 8 ميجا');

let R={unit:'day',ref:new Date(),f:'',t:''};

function span(){const a=new Date(R.ref);a.setHours(0,0,0,0);const y=a.getFullYear(),m=a.getMonth(),L=(d,o)=>d.toLocaleDateString('ar-EG',o);let f,t,l;
 if(R.unit==='day'){f=a;t=new Date(a);t.setDate(t.getDate()+1);l=L(a,{weekday:'long',day:'numeric',month:'long'})}
 else if(R.unit==='week'){f=new Date(a);f.setDate(f.getDate()-((f.getDay()+1)%7));t=new Date(f);t.setDate(t.getDate()+7);const e=new Date(t);e.setDate(e.getDate()-1);l=L(f,{day:'numeric',month:'short'})+' ← '+L(e,{day:'numeric',month:'short'})}
 else if(R.unit==='month'){f=new Date(y,m,1);t=new Date(y,m+1,1);l=L(f,{month:'long',year:'numeric'})}
 else if(R.unit==='year'){f=new Date(y,0,1);t=new Date(y+1,0,1);l=String(y)}
 else{f=R.f?new Date(R.f+'T00:00'):a;t=new Date(((R.t||R.f)||'')?(R.t||R.f)+'T00:00':a);t.setDate(t.getDate()+1);l='فترة مخصصة'}
 return {f,t,l}}

function shift(d){const r=new Date(R.ref);
 if(R.unit==='day')r.setDate(r.getDate()+d);else if(R.unit==='week')r.setDate(r.getDate()+7*d);else if(R.unit==='month')r.setMonth(r.getMonth()+d);else if(R.unit==='year')r.setFullYear(r.getFullYear()+d);
 const old=R.ref;R.ref=r;const sp=span();
 if(sp.f>new Date()){R.ref=old;return}
 if(plan()==='free'){const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-7);if(sp.f<lim){R.ref=old;toast('الباقة المجانية بتعرض آخر 7 أيام. رقّي لتشوف كل التاريخ');return page('upgrade')}}
 reports()}

 catch(e){toast('فشل: '+(e.message||e))}}

/* ---------- المشتركين (للمدير) ---------- */
async function subs(){if(!S.admin)return;
 $('#main').innerHTML=`<a onclick="page('admin')">→ رجوع</a><h3>📋 المشتركين والاشتراكات</h3><input id=sbq placeholder="🔍 بحث باسم المحل أو الإيميل" oninput=sblist()><div id=sbl><p class=mut>جاري التحميل...</p></div>`;
 const r=await sb.rpc('admin_list_businesses');
 if(r.error){$('#sbl').innerHTML=`<div class=card><small>${esc(r.error.message)}<br>شغّل ملف abuda_ALL.sql في Supabase.</small></div>`;return}
 S.sb=r.data||[];sblist()}
function sblist(){const q=($('#sbq').value||'').toLowerCase(),now=Date.now();
 $('#sbl').innerHTML=S.sb.filter(b=>(b.name+' '+(b.owner_email||'')).toLowerCase().includes(q)).map(b=>{
  const ex=b.plan_expires_at?new Date(b.plan_expires_at):null,d=ex?Math.ceil((ex-now)/864e5):0,paid=b.plan_id!=='free'&&ex&&ex>now;
  const st=paid?`<span class="${d<=5?'neg':''}">تنتهي بعد ${d} يوم (${ex.toLocaleDateString('ar-EG')})</span>`:(b.plan_id!=='free'?'<b class=neg>الاشتراك انتهى</b>':'باقة مجانية');
  return `<div class=card><div class=row style="justify-content:space-between"><b>${esc(b.name)}</b><span class=badge style="${paid?'':'background:#333'}">${paid?esc(b.plan_id):'free'}</span></div><small dir=ltr>${esc(b.owner_email||'')}</small><br><small>${st} • سجّل ${new Date(b.created_at).toLocaleDateString('ar-EG')}</small>
<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sec" style="margin:0;flex:1" onclick="setPlan('${b.id}','pro')">Pro ‏+30</button><button class="btn sec" style="margin:0;flex:1" onclick="setPlan('${b.id}','business')">Business ‏+30</button><button class="btn red" style="margin:0;flex:1" onclick="setPlan('${b.id}','free')">إلغاء</button></div></div>`}).join('')||'<p class=mut>مفيش محلات</p>'}
async function setPlan(id,p){if(!confirm(p==='free'?'إلغاء الاشتراك والرجوع للمجاني؟':'تفعيل أو تمديد باقة '+p+' لمدة 30 يوم؟'))return;
 const r=await sb.rpc('admin_set_plan',{p_business:id,p_plan:p,p_days:30});if(r.error)return toast(r.error.message);toast('تم ✅');subs()}

const views={home,prods,sell,reports,more,buy,exp,team,branches,upgrade,admin,subs,customers,shop,staff};
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(newPass,600);if(ev==='SIGNED_OUT'){S={biz:null,role:null,user:null,fields:[],products:[],cart:[],tab:'home'};authView()}});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?loadBiz():authView()})();
</script>
